<svg width="960" height="1098" viewBox="0 0 960 1098" role="img" aria-label="prose-deslop 九步流程：入口判定、判场景、划保护片段、前测、词面扫描、逐行审计、应用替换、四遍回读、后测与报告">
<defs><marker id="fa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="var(--red)"/></marker></defs>
<style>
.num{fill:var(--muted);font:300 25px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;opacity:.5;font-variant-numeric:tabular-nums}
.nm{fill:var(--ink);font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wh{fill:var(--muted);font:10.5px ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.1em}
.de{fill:var(--ink-2);font:13.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.ph{fill:var(--muted);font:600 10.5px ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.18em}
.as{fill:var(--muted);font:12.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.asb{fill:var(--ink-2);font:600 12.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.rk{fill:var(--ink);font:600 13px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.rc{fill:var(--muted);font:11.5px system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.rl{fill:var(--red);font:600 11px ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.08em}
.lg{fill:var(--muted);font:10.5px ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;letter-spacing:.1em}
</style>
<circle cx="601" cy="34" r="4" fill="var(--blue)"/>
<text class="lg" x="612" y="38">脚本</text>
<circle cx="662" cy="34" r="4" fill="var(--steel)"/>
<text class="lg" x="673" y="38">agent</text>
<circle cx="732" cy="34" r="4" fill="var(--amber)"/>
<text class="lg" x="743" y="38">换上下文</text>
<circle cx="815" cy="34" r="4" fill="var(--violet)"/>
<text class="lg" x="826" y="38">冻结不许改</text>
<text class="ph" x="132" y="70">框定</text>
<line x1="132" y1="80" x2="884" y2="80" stroke="var(--rule)" stroke-width="1"/>
<text class="ph" x="132" y="386">查找</text>
<line x1="132" y1="396" x2="884" y2="396" stroke="var(--rule)" stroke-width="1"/>
<text class="ph" x="132" y="762">修改与验证</text>
<line x1="132" y1="772" x2="884" y2="772" stroke="var(--rule)" stroke-width="1"/>
<line x1="100" y1="119" x2="100" y2="1047" stroke="var(--rule-2)" stroke-width="1"/>
<path d="M100 913 C 66 913, 66 811, 94 811" fill="none" stroke="var(--red)" stroke-width="1.2" opacity=".75" marker-end="url(#fa)"/>
<text class="num" x="46" y="126" text-anchor="end">01</text>
<circle cx="100" cy="119" r="4.5" fill="var(--steel)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="124">入口判定</text>
<text class="wh" x="132" y="145">agent</text>
<text class="de" x="430" y="123">这段文本该不该改。要逐字翻译的，要仿模板的，</text>
<text class="de" x="430" y="144">主体是代码日志的，要事实校对的，都退回</text>
<text class="num" x="46" y="222" text-anchor="end">02</text>
<circle cx="100" cy="215" r="4.5" fill="var(--steel)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="220">判场景</text>
<text class="wh" x="132" y="241">agent</text>
<text class="de" x="430" y="219">六个场景选一个。它决定合格标准是什么，</text>
<text class="de" x="430" y="240">聊天的标准和论文的标准不是同一条线</text>
<text class="num" x="46" y="318" text-anchor="end">03</text>
<circle cx="100" cy="311" r="4.5" fill="var(--violet)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="316">划保护片段</text>
<text class="wh" x="132" y="337">agent · 产出冻结层</text>
<text class="de" x="430" y="315">数字，引用，命令，报错，责任归属。</text>
<text class="de" x="430" y="336">另记一份关系清单，这层没有词表能替代</text>
<text class="num" x="46" y="442" text-anchor="end">04</text>
<circle cx="100" cy="435" r="4.5" fill="var(--blue)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="440">前测</text>
<text class="wh" x="132" y="461">脚本 · measure.py</text>
<text class="de" x="430" y="439">读数存成 JSON。第 09 步要和它对照，</text>
<text class="de" x="430" y="460">这是整条流程里唯一能证伪的部分</text>
<text class="num" x="46" y="538" text-anchor="end">05</text>
<circle cx="100" cy="531" r="4.5" fill="var(--steel)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="536">词面扫描</text>
<text class="wh" x="132" y="557">脚本 + agent</text>
<text class="de" x="430" y="535">物理动词（中）／抬高词（英），再过 625 行词表。</text>
<text class="de" x="430" y="556">出候选，不出判定</text>
<text class="num" x="46" y="634" text-anchor="end">06</text>
<circle cx="100" cy="627" r="4.5" fill="var(--amber)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="632">逐行审计</text>
<text class="wh" x="132" y="653">agent · 必须换上下文</text>
<text class="de" x="430" y="631">逐行出表，一行一条命中，宁可多报。</text>
<text class="de" x="430" y="652">写的那个 agent 审不了自己写的，所以换一个空白上下文</text>
<text class="num" x="46" y="818" text-anchor="end">07</text>
<circle cx="100" cy="811" r="4.5" fill="var(--steel)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="816">应用替换</text>
<text class="wh" x="132" y="837">agent</text>
<text class="de" x="430" y="815">换成字面动作。文本只在这一步被改，</text>
<text class="de" x="430" y="836">不许用另一个花哨词换掉这个花哨词</text>
<text class="num" x="46" y="920" text-anchor="end">08</text>
<circle cx="100" cy="913" r="4.5" fill="var(--steel)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="918">四遍回读</text>
<text class="wh" x="132" y="939">agent · 不许合并</text>
<text class="de" x="430" y="917">四遍看的不是同一种东西，所以不许合并。</text>
<text class="de" x="430" y="938">B 或 D 命中，回到 07 重改</text>
<text class="num" x="46" y="1054" text-anchor="end">09</text>
<circle cx="100" cy="1047" r="4.5" fill="var(--blue)" stroke="var(--panel)" stroke-width="3"/>
<text class="nm" x="132" y="1052">后测与报告</text>
<text class="wh" x="132" y="1073">脚本 + agent，交给人</text>
<text class="de" x="430" y="1051">交前后两个数，每个还留在表上的命中</text>
<text class="de" x="430" y="1072">逐条写明为什么留</text>
<line x1="424" y1="668" x2="424" y2="710" stroke="var(--rule)" stroke-width="2"/>
<text class="asb" x="442" y="682">不是语域问题，本流程不处理</text>
<text class="as" x="442" y="704">悬空指代 · 前后矛盾 · 引文误读 · 数字错</text>
<text class="rl" x="430" y="970">A</text>
<text class="rk" x="446" y="970">保真</text>
<text class="rc" x="430" y="990">保护片段没漂</text>
<text class="rl" x="544" y="970">B</text>
<text class="rk" x="560" y="970">过校正</text>
<text class="rc" x="544" y="990">查你刚写下的</text>
<text class="rl" x="658" y="970">C</text>
<text class="rk" x="674" y="970">残留</text>
<text class="rc" x="658" y="990">固定只查五类</text>
<text class="rl" x="772" y="970">D</text>
<text class="rk" x="788" y="970">通读</text>
<text class="rc" x="772" y="990">看两处修改的交界</text>
</svg>
